name: Deploy IDRIS TRACE to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

# Keep only one Pages deployment active at a time.
concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Remove stale Pages artifacts from earlier attempts
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            for (const artifact of data.artifacts) {
              if (artifact.name === 'github-pages') {
                core.info(`Deleting stale Pages artifact ${artifact.id}`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
