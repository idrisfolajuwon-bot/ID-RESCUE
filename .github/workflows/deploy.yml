name: Deploy IDRIS TRACE to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

# Queue deployments instead of cancelling an upload/deploy in progress.
concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
