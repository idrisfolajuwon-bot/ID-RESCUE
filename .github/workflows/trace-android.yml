name: Build IDRIS AI STUDIO APK
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/trace-android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build IDRIS AI STUDIO APK
        working-directory: android
        run: gradle assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: IDRIS-AI-STUDIO-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: IDRIS AI STUDIO Android
          body: |
            Official Android APK for IDRIS AI STUDIO.
            Download IDRIS-AI-STUDIO.apk and install it on your Android device.
            Online AI features require an internet connection.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          asset_name: IDRIS-AI-STUDIO.apk
          overwrite_files: true
          make_latest: true
