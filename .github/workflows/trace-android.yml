name: Build IDRIS Phone Finder Android APK
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/trace-android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build side-by-side Phone Finder APK
        working-directory: android
        run: gradle assembleDebug
      - name: Upload Phone Finder APK
        uses: actions/upload-artifact@v4
        with:
          name: IDRIS-PHONE-FINDER-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Prepare clearly named Phone Finder download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/IDRIS-PHONE-FINDER.apk
      - name: Publish Phone Finder APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: IDRIS AI STUDIO Android
          body: |
            IDRIS Phone Finder companion build.
            This installs alongside the existing IDRIS AI STUDIO app.
            Open the app, sign into your IDRIS account, and enable recovery only on your own phone after reviewing Android permissions.
            Location sharing is visible and can be stopped from the notification.
          files: android/app/build/outputs/apk/debug/IDRIS-PHONE-FINDER.apk
          make_latest: true
