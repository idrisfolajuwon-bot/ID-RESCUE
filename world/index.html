-size:10px;font-weight:700;box-shadow:0 0 18px #22bce933;touch-action:manipulation}.action.primary{background:linear-gradient(145deg,#0b91bd,#07527e);border-color:#8ff0ff}.toolbar{position:absolute;left:50%;transform:translateX(-50%);bottom:17px;display:flex;gap:8px;pointer-events:auto}.tool{padding:10px 13px;border:1px solid #6ddfff77;border-radius:12px;background:#071a36d9;color:#eafaff;font-weight:700;font-size:11px;white-space:nowrap}.tool:active,.action:active{transform:scale(.96)}#hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:9px 13px;font-size:12px;text-align:center;color:#d8f5ff;opacity:0;transition:opacity .2s;max-width:80%}.help{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-size:10px;color:#a9d8ec;text-align:center;white-space:nowrap}.crosshair{position:absolute;left:50%;top:50%;width:8px;height:8px;border:1px solid #b8f3ff;border-radius:50%;opacity:.55;transform:translate(-50%,-50%)}@media(min-width:800px){.controls{width:132px;height:132px}.stick{left:40px;top:40px}.actions{flex-direction:row}.action{width:62px;height:62px}.toolbar{bottom:22px}}@media(max-height:500px){.controls{width:90px;height:90px}.stick{width:38px;height:38px;left:25px;top:25px}.actions{gap:5px}.action{width:44px;height:44px}.toolbar{bottom:8px}.tool{padding:7px 9px}}

<body>
<div id="loading"><div><div style="font-size:42px">👑</div><h1>IDRIS WORLD</h1><p>Building your city...</p><div style="width:190px;height:4px;background:#23445d;border-radius:8px;margin:20px auto;overflow:hidden"><div style="height:100%;width:65%;background:#49dcff;box-shadow:0 0 12px #49dcff"></div></div></div></div>
<div id="hud">

 <div class="status panel"><strong>OPEN CITY</strong><br><span id="mode">ON FOOT</span> · <span id="clock">DAY</span></div>

</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const loading=document.getElementById('loading'),hint=document.getElementById('hint');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x82bce0);scene.fog=new THREE.Fog(0x82bce0,65,230);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,450);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=false;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc7eaff,0x344052,2.1));const sun=new THREE.DirectionalLight(0xffe1b0,2.4);sun.position.set(-45,80,35);scene.add(sun);

const asphalt=mat(0x202b38),sidewalk=mat(0x89939a),white=mat(0xe7e9e8),glass=mat(0x163a55,.22,.65),dark=mat(0x101923,.32,.6),gold=mat(0xe5ad3c,.32,.65),grass=mat(0x285d43);
function box(w,h,d,x,y,z,material,group=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);o.position.set(x,y,z);group.add(o);return o}
const ground=box(260,.5,260,0,-.35,0,grass);const road=box(18,.08,220,0,-.05,0,asphalt);box(220,.08,18,0,-.04,0,asphalt);
for(let i=-100;i<=100;i+=10){box(.18,.02,4,i,-.005,0,white);box(4,.02,.18,0,-.005,i)}
// city blocks and towers
for(let x=-85;x<=85;x+=17)for(let z=-85;z<=85;z+=17){if(Math.abs(x)<17||Math.abs(z)<17)continue;const h=8+Math.random()*27,w=8+Math.random()*4,d=8+Math.random()*4;const b=box(w,h,d,x,h/2,z,mat([0x42566b,0x65798a,0x34495d,0x8a8176][Math.floor(Math.random()*4)],.65,.15));for(let y=3;y<h-1;y+=3){for(let xx=-w/2+1;xx<w/2;xx+=2)box(.85,.9,.05,x+xx,y,z+d/2+.03,glass);}}
function tree(x,z){const trunk= new THREE.Mesh(new THREE.CylinderGeometry(.22,.32,3,7),mat(0x62432c));trunk.position.set(x,1.5,z);scene.add(trunk);const crown=new THREE.Mesh(new THREE.SphereGeometry(1.7,8,7),mat(0x26734a));crown.position.set(x,3.8,z);scene.add(crown)}
for(let i=0;i<30;i++){const side=i%2?1:-1;tree(side*(13+Math.random()*5),-95+i*6)}
// signature mansion
const mansion=new THREE.Group();scene.add(mansion);box(24,8,17,-28,4,-24,mat(0x9caab3,.35),mansion);box(25,.35,18,-28,8.1,-24,gold,mansion);box(24,3,17,-28,9.7,-24,mat(0x263d50,.2,.5),mansion);for(let x=-38;x<=-18;x+=5)box(.18,5,.2,x,4.2,-15.4,gold,mansion);box(8,5,.2,-28,3,-15,glass,mansion);box(5,1,.2,-28,6,-15,gold,mansion);box(5,.25,20,-28,.2,-13,sidewalk,mansion);
for(let x=-38;x<-17;x+=3)tree(x,-36);
// SUV
const car=new THREE.Group();scene.add(car);car.position.set(-7,0,-11);
box(4.2,1.15,7,0,1,0,mat(0x080f18,.28,.65),car);box(3.5,1.05,3.3,0,2,-.35,glass,car);box(3.7,.18,7.1,0,1.55,0,gold,car);
for(const x of [-2.05,2.05])for(const z of [-2.2,2.2]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.58,.58,.32,16),dark);wheel.rotation.z=Math.PI/2;wheel.position.set(x,.65,z);car.add(wheel)}
for(const x of [-1.35,1.35]){box(.8,.32,.08,x,1.25,3.55,white,car);box(.8,.32,.08,x,1.25,-3.55,mat(0xff3030),car)}
// player simple stylised avatar
const player=new THREE.Group();scene.add(player);const body= new THREE.Mesh(new THREE.CapsuleGeometry(.48,1.0,4,8),mat(0x101b2d));body.position.y=1.25;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.36,12,10),mat(0x8b583e));head.position.y=2.25;player.add(head);const hoodie=box(.8,.18,.12,0,1.6,-.49,gold,player);
player.position.set(0,0,8);
const target=new THREE.Vector3(),camOffset=new THREE.Vector3(0,4.2,8);let yaw=0,pitch=.12,night=false,inCar=false,velocityY=0,onGround=true;let move={x:0,y:0};let lastTouch=null;
function showHint(t){hint.textContent=t;hint.style.opacity=1;clearTimeout(showHint.timer);showHint.timer=setTimeout(()=>hint.style.opacity=0,2200)}
function setNight(){night=!night;const c=night?0x07152c:0x82bce0;scene.background.setHex(c);scene.fog.color.setHex(c);sun.intensity=night?.35:2.4;scene.traverse(o=>{if(o.material&&o.material.emissive){o.material.emissive.setHex(night?0x15294c:0x000000)}});document.getElementById('clock').textContent=night?'NIGHT':'DAY';}
function updateCamera(){const focus=inCar?car.position:player.position;const dir=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));const pos=focus.clone().add(new THREE.Vector3(-dir.x*8,4.4,-dir.z*8));pos.y+=pitch*3;camera.position.lerp(pos,.12);camera.lookAt(focus.x,focus.y+1.4,focus.z)}
function enterCar(){if(!inCar&&player.position.distanceTo(car.position)<7){inCar=true;player.visible=false;document.getElementById('mode').textContent='DRIVING';document.getElementById('enter').textContent='EXIT CAR';showHint('You are driving. Use the joystick to cruise.')}else if(inCar){inCar=false;player.visible=true;player.position.copy(car.position).add(new THREE.Vector3(3,0,0));document.getElementById('mode').textContent='ON FOOT';document.getElementById('enter').textContent='ENTER CAR';showHint('Back on foot.')}else showHint('Move closer to the black SUV to enter it.')}
document.getElementById('enter').onclick=enterCar;document.getElementById('day').onclick=setNight;document.getElementById('home').onclick=()=>{inCar=false;player.visible=true;player.position.set(0,0,8);car.position.set(-7,0,-11);yaw=0;document.getElementById('mode').textContent='ON FOOT';document.getElementById('enter').textContent='ENTER CAR';showHint('Welcome back to IDRIS WORLD.')};
document.getElementById('jump').onclick=()=>{if(!inCar&&onGround){velocityY=7;onGround=false}};
const joy=document.getElementById('joy'),stick=document.getElementById('stick');let joyId=null;
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(joyId);moveJoy(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)moveJoy(e)});function moveJoy(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.34,len=Math.hypot(dx,dy),s=Math.min(1,max/(len||1));move.x=dx*s/max;move.y=dy*s/max;stick.style.transform='translate('+dx*s+'px,'+dy*s+'px)'}function endJoy(e){if(e.pointerId===joyId){joyId=null;move={x:0,y:0};stick.style.transform='translate(0,0)'}}joy.addEventListener('pointerup',endJoy);joy.addEventListener('pointercancel',endJoy);
renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX<140&&e.clientY>innerHeight-160)return;lastTouch={x:e.clientX,y:e.clientY,id:e.pointerId};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(lastTouch&&lastTouch.id===e.pointerId){yaw-=(e.clientX-lastTouch.x)*.006;pitch=Math.max(-.35,Math.min(.65,pitch+(e.clientY-lastTouch.y)*.002));lastTouch={x:e.clientX,y:e.clientY,id:e.pointerId}}});renderer.domElement.addEventListener('pointerup',()=>lastTouch=null);
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);let x=move.x+(keys.d?1:0)-(keys.a?1:0),y=move.y+(keys.s?1:0)-(keys.w?1:0);const len=Math.hypot(x,y);if(len>1){x/=len;y/=len}const speed=inCar?15:5.3;const obj=inCar?car:player;const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));obj.position.addScaledVector(forward,-y*speed*dt);obj.position.addScaledVector(right,x*speed*dt);if(inCar&&len>.08)car.rotation.y=yaw;else if(!inCar&&len>.08)player.rotation.y=Math.atan2(-forward.x*y+right.x*x,-forward.z*y+right.z*x);if(!inCar){velocityY-=18*dt;player.position.y+=velocityY*dt;if(player.position.y<=0){player.position.y=0;velocityY=0;onGround=true}}updateCamera();renderer.render(scene,camera)}
camera.position.set(0,5,16);camera.lookAt(0,1,0);animate();loading.style.display='none';showHint('Use the left stick to move. Drag the screen to look around.');
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5))});
</script>
